# Independent immutable reference facts. No new architecture is inferred from these totals.
paper_explicit:
  image_shape: [3, 224, 224]
  local_shape: [1024, 14, 14]
  image_blocks: 4
  language_encoder_blocks: 12
  language_decoder_blocks: 7
  embed_dim: 512
  vocabulary_size: 49408
  text_length: 308
  classes: 2
  batch_size: 8
  reported_total_parameters_millions: 141.00
  reported_total_flops_billions: 173.04
  reported_hardware: Tesla_V100
  vim_equation_10: 'T_glo[j,i] = softmax(Q[j,i] K[j,i]^T / sqrt(r/d)) V[j,i]'
  total_equation_27: 'L = L_fd + L_lr + L_cmc + L_fl + L_ar + L_kl'

proposal:
  execution:
    scope: full_reference_after_separate_approval
    components: [mve, vision_decoder, detection_head, adapter, language, objective]
    # Full reference execution remains unapproved; only the MVE builder is implemented.
    reject_unapproved_execution: true

  mve:
    input:
      channels: 3
      height: 224
      width: 224
      layout: NCHW
      dtype: float32
      appearance_range: [0.0, 1.0]
      appearance_range_is_preprocessing_contract: true
      implicit_resize: false
      implicit_dtype_or_device_conversion: false
      implicit_normalization: false
      finite_values_required: true
      nonempty_batch_required: true
    encoder:
      family: proposed_padded_unet_contracting_path
      stage_channels: [64, 128, 256, 512, 1024]
      convolutions_per_stage: 2
      convolution:
        kernel_size: 3
        stride: 1
        padding: 1
        padding_mode: zeros
        dilation: 1
        groups: 1
        bias: true
      activation: relu
      activation_inplace: false
      normalization: none
      dropout: 0.0
      pooling:
        kind: max_pool_2d
        after_stages: [0, 1, 2, 3]
        kernel_size: 2
        stride: 2
        padding: 0
        dilation: 1
        ceil_mode: false
      bottleneck_shape: [1024, 14, 14]
      appearance_skip_stages: [0, 1, 2, 3]
      appearance_skip_shapes:
        - [64, 224, 224]
        - [128, 112, 112]
        - [256, 56, 56]
        - [512, 28, 28]
      skip_detach: false
      return_residual_skips: false
    tokenizer:
      flatten_order: row_major_spatial_then_channels
      projection_in_features: 1024
      embed_dim: 512
      projection_bias: true
      spatial_token_count: 196
      sequence_length: 197
      class_token:
        learnable: true
        parameter_shape: [1, 1, 512]
        placement: append
        index: 196
      position:
        learnable: true
        parameter_shape: [1, 197, 512]
        interpolate: false
      embedding_normalization: none
      embedding_dropout: 0.0
    transformer:
      depth: 4
      embed_dim: 512
      heads: 8
      head_dim: 64
      block_order: [pre_ln_self_attention_residual, pre_ln_ffn_residual]
      ln:
        normalized_dim: 512
        epsilon: 1.0e-5
        elementwise_affine: true
        bias: true
      attention:
        projections: separate_q_k_v
        qkv_bias: true
        output_bias: true
        scale_denominator: sqrt_head_dim
        softmax_axis: keys
        causal: false
        padding_mask: false
        dropout: 0.0
      ffn:
        in_features: 512
        hidden_features: 2048
        out_features: 512
        activation: gelu
        gelu_approximation: none
        bias: true
        dropout: 0.0
      residual_dropout: 0.0
      stochastic_depth: 0.0
      layer_scale: null
      final_normalization: none
      output_projection: none
      share_blocks_across_depth: false
    sharing:
      share_parameters_between_roles: true
      owner: mve.shared_encoder
      number_of_registered_encoders: 1
      roles: [appearance, residual]
      separate_role_positions: false
      separate_role_normalization: false
      initialize_once: true
      checkpoint_subtrees: 1
    residual:
      operation: absolute_difference
      operands: [reconstruction, input_image]
      detach_reconstruction: false
      detach_residual: false
      subgradient_at_zero: 0.0
      clip: false
      renormalize: false
      upper_bound: null
    fusion:
      operation: elementwise_sum
      operands: [appearance_global, residual_global]
      normalize: false
      output_shape_without_batch: [1, 512]
    api:
      appearance_method: encode_appearance
      forward_inputs: [image, reconstruction, optional_appearance_encoding]
      appearance_fields: [local, skips, tokens, global_token]
      output_fields: [appearance, residual_image, residual_tokens, residual_global, fused_global]
      cached_record_policy: explicit_same_input_same_graph_same_parameters
      persistent_activation_cache: false
      owns_decoder: false
      owns_classifier: false

  # A02/A05/A06: concrete later proposal; excluded from MVE-only coding approval.
  vision_decoder:
    enabled: true
    shared_trunk: true
    trunk_evaluations_per_appearance: 1
    skip_policy: concatenate_corresponding_appearance_skip
    upsample:
      kind: transposed_convolution
      kernel_size: 2
      stride: 2
      padding: 0
      output_padding: 0
      dilation: 1
      groups: 1
      bias: true
      channel_pairs: [[1024, 512], [512, 256], [256, 128], [128, 64]]
    post_concat_convolution_channels:
      - [1024, 512, 512]
      - [512, 256, 256]
      - [256, 128, 128]
      - [128, 64, 64]
    convolution_kernel: 3
    convolution_padding: 1
    convolution_stride: 1
    convolution_bias: true
    activation: relu
    normalization: none
    dropout: 0.0
    appearance_head:
      in_channels: 64
      out_channels: 3
      kernel_size: 1
      bias: true
      activation: identity
    mask_head:
      in_channels: 64
      out_channels: 2
      kernel_size: 1
      bias: true
      activation: identity

  heads:
    enabled: true
    detection: {in_features: 512, out_features: 2, hidden_layers: 0, bias: true}
    adapter: {in_features: 512, out_features: 512, hidden_layers: 0, bias: true}

  # These later-language choices remain PROPOSED and cannot block MVE-only coding.
  language:
    enabled: true
    vocabulary_size: 49408
    embed_dim: 512
    sequence_length: 308
    prompt_levels: [L1, L2, L3, L4]
    packing: concatenate_independent_level_sequences
    tokens_per_level: 77
    level_order: [L1, L2, L3, L4]
    add_bos_eos_per_level: true
    padding_side: right
    truncation: reject_overflow
    tokenizer:
      family: clip_bpe
      artifact_path: null
      artifact_sha256: null
      version: null
      bos_id: null
      eos_id: null
      pad_fill_id: null
      readiness: BLOCKED
    encoder:
      depth: 12
      heads: 8
      ffn_hidden: 2048
      ffn_activation: gelu_exact
      order: [pre_ln_mha_residual, vim_delta_residual, ffn_residual]
      additional_norms: false
      ln_epsilon: 1.0e-5
      mha_bias: true
      ffn_bias: true
      causal: false
      key_padding_mask: false
      pooling: physical_last_position
      pooling_index: 307
      final_normalization: none
      dropout: 0.0
    decoder:
      depth: 7
      heads: 8
      ffn_hidden: 2048
      ffn_activation: gelu_exact
      order: [causal_self_mha_residual, encoder_memory_mha_residual, ffn_residual, vim_delta_residual]
      shift: prepend_bos_drop_last_once_over_whole_sequence
      targets: unshifted_ids_including_original_bos_eos_padding
      causal_self_attention: true
      key_padding_mask: false
      memory_mask: none
      extra_normalizations: false
      mha_bias: true
      ffn_bias: true
      dropout: 0.0
    positions: learned_separate_encoder_decoder
    vocabulary_output:
      weight_tied: true
      bias: false
    vim:
      key_value_length: 1
      heads: 8
      scale_denominator: sqrt_r_over_d
      softmax_axis: keys
      projection_bias: false
      attention_dropout: 0.0
      output_contract: delta_only
      residual_owner: caller_once
      independent_instance_per_block: true
      keep_qk_projections_despite_singleton_degeneracy: true
    ffpp_separate_model_proposal:
      prompt_levels: [L1, L2]
      sequence_length: 154
      pooling_index: 153
      classification: ASSUMED
      approval: PROPOSED

  losses:
    enabled: true
    formulation: disclosed_operational_interpretation_of_published_equations
    weights: {fd: 1.0, lr: 1.0, cmc: 1.0, fl: 1.0, ar: 1.0, kl: 1.0}
    fd: {kind: categorical_log_softmax_ce, reduction: batch_mean}
    ar: {kind: squared_error, reduction: all_image_elements_mean}
    fl: {kind: two_class_log_softmax_ce, reduction: batch_and_pixels_mean}
    lr:
      kind: vocabulary_log_softmax_ce
      reduction: token_sum_then_batch_mean
      include_padding_positions: true
      include_bos_eos_positions: true
    cmc:
      similarity: raw_dot_product
      normalize_features: false
      positive_pairs: batch_diagonal
      reverse_direction: transpose_raw_scores_then_row_softmax
      reduction: mean_of_two_batch_mean_cross_entropies
      initial_temperature: 0.07
      trainable_temperature: true
      parameterization: log_denominator_temperature
      initial_log_temperature: -2.659260036932778
      effective_temperature: exp_log_temperature
      weight_decay_on_log_temperature: 0.0
      clamp_temperature: false
      reject_nonfinite_or_nonpositive_effective_temperature: true
    kl:
      direction: text_to_adapted_vision
      temperature: 0.5
      softmax_convention: divide_logits_by_temperature
      softmax_axis: features
      reduction: feature_sum_then_batch_mean
      detach_text_target: false
      multiply_by_temperature_squared: false

  data:
    dataset: GenFace
    training_source_generator: DiffFace
    first_evaluation_generators: [FSLSD, LatDiff, FaceSwapper]
    dataset_root: null
    train_manifest: null
    validation_manifest: null
    test_manifests: null
    source_pair_manifest: null
    grouping_manifest: null
    artifacts_verified: false
    image_preprocessing:
      supplied_aligned_face_crops_required: true
      extra_face_detection: false
      native_pair_shape_must_match: true
      color_order: RGB
      target_size: [224, 224]
      preserve_aspect_ratio: false
      resize: bilinear
      antialias: true
      align_corners: false
      output_scale: divide_by_255
      mean_std_normalization: false
      augmentation: none
      image_backend_version: null
    masks:
      difference_resolution: native_aligned_crop
      difference_arithmetic: float32_absolute_rgb
      grayscale_weights_rgb: [0.299, 0.587, 0.114]
      grayscale_divisor: 255.0
      threshold: 0.1
      comparison: strictly_greater
      resize_after_threshold: nearest
      real_value: 0
      efs_value: 1
      missing_or_unaligned_source_pair: reject
    splits:
      prefer_official_splits: true
      prefer_official_validation: true
      fallback_validation_fraction_of_source_training_groups: 0.1
      fallback_split_seed: 0
      disjoint_groups: [source_pair, identity, video]
      missing_group_metadata: block_leakage_free_claim_and_resolve_manifest
      target_test_tuning: false

  training:
    enabled: true
    batch_size: 8
    max_epochs: 45
    max_steps: null
    seed: 0
    final_repeat_seeds: [0, 1, 2]
    sampling: uniform_shuffled_records
    class_balancing: false
    drop_last_train_batch: true
    gradient_accumulation_steps: 1
    distributed_negatives: false
    optimizer:
      name: Adam
      learning_rate: 1.0e-4
      weight_decay: 1.0e-3
      betas: [0.9, 0.999]
      epsilon: 1.0e-8
      amsgrad: false
      decoupled_weight_decay: false
      decay_exemptions: [cmc_log_temperature]
    scheduler:
      kind: step_decay
      period_epochs: 15
      factor: 0.1
      step_timing: after_completed_epoch
    warmup_epochs: 0
    gradient_clipping: null
    early_stopping: false
    validation_frequency_epochs: 1
    checkpoint_selection:
      domain: source_validation_only
      primary: max_auc
      tie_breakers: [min_fd_cross_entropy, earliest_epoch]

  initialization:
    pretrained_weights: false
    seed: 0
    device: cpu_before_device_transfer
    conv2d_weights: {kind: kaiming_normal, mode: fan_in, nonlinearity: relu}
    visual_linear_weights: {kind: xavier_uniform, gain: 1.0}
    visual_qkv_initialization: independent_matrices
    all_visual_biases: zeros
    layer_norm_scale: ones
    layer_norm_bias: zeros
    visual_class_and_position: {kind: normal_untruncated, mean: 0.0, std: 0.02}
    visual_initialization_order:
