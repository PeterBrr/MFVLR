    absent_class_union_zero: omit_and_report_support
    single_class_auc: undefined_and_report
    target_threshold_optimization: false
    corruption_recipe: null
    gt_threshold_sensitivity_evaluation_target: fixed_0_1_separate_from_changing_gt_study
    numerical_replication_tolerance: null

  runtime:
